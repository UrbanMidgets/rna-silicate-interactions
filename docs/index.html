<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RNA Silicate Viewer</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="sidebar">
        <h1>RNA Silicate Viewer</h1>
        <p class="hint">Filter and inspect structures from the curated thesis dataset.</p>

        <div class="sidebar-content">
          <label for="surface">Surface</label>
          <select id="surface"></select>

          <label for="system">System</label>
          <select id="system"></select>

          <label for="role">Role</label>
          <select id="role"></select>

          <label for="frame">Frame</label>
          <select id="frame"></select>

          <label for="state">State</label>
          <select id="state"></select>
        </div>

        <div class="metrics">
          <div><strong id="match-count">0</strong> matching files</div>
          <div><strong id="group-count">0</strong> matching groups</div>
        </div>
      </div>

      <main class="main">
        <section class="viewer-wrap">
          <div id="viewer"></div>
        </section>

        <section class="panel">
          <h2>Selection</h2>
          <div id="selection-meta">No structure selected.</div>
          <h3>Files</h3>
          <ul id="file-links"></ul>
        </section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
